name: Qodo Cover with NVIDIA NIM

on:
  workflow_dispatch:
    inputs:
      desired_coverage:
        description: Desired coverage percentage
        required: false
        default: "70"

permissions:
  contents: write
  pull-requests: write

jobs:
  run-qodo-cover:
    runs-on: ubuntu-22.04
    env:
      COVERAGE_FILE: /tmp/qodo-cover.coverage
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest pytest-cov

      - name: Generate tests with Qodo Cover
        uses: qodo-ai/qodo-ci/.github/actions/qodo-cover@v0.1.16
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          project_language: python
          project_root: qodo_demo
          code_coverage_report_path: qodo_demo/coverage.xml
          coverage_type: cobertura
          test_command: pytest -p no:cacheprovider test_pricing.py --cov=pricing --cov-report=xml:coverage.xml --cov-report=term
          model: nvidia_nim/nvidia/llama-3.3-nemotron-super-49b-v1.5
          max_iterations: 3
          desired_coverage: ${{ inputs.desired_coverage }}
          run_each_test_separately: true
          source_folder: .
          test_folder: .
          additional_instructions: >-
            Keep generated tests short and only edit test_pricing.py.
            Do not modify pricing.py.
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
